<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DataDash</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:     #1D4ED8;
    --blue-med: #2563EB;
    --blue-lt:  #DBEAFE;
    --green-d:  #16A34A;
    --green-bg: #DCFCE7;
    --green-br: #86efac;
    --red:      #ef4444;
    --t1: #0F172A; --t2: #334155; --t3: #94A3B8;
    --border: #E2E8F0; --bg: #F8FAFC; --card: #FFFFFF;
    --font: 'Plus Jakarta Sans', sans-serif;
  }
  html, body { height: 100%; font-family: var(--font); background: #fff; color: var(--t1); -webkit-font-smoothing: antialiased; font-size: 14px; }
  .layout { display: flex; height: 100vh; }
  .sidebar {
    width: 240px; background: #0f172a;
    display: flex; flex-direction: column;
    padding: 28px 0 24px; flex-shrink: 0;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 22px 36px; }
  .logo-svg { width: 38px; height: 38px; flex-shrink: 0; }
  .logo-text { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 22px; font-size: 13px; font-weight: 600;
    color: #94a3b8; cursor: pointer;
    border-left: 3px solid transparent;
    text-decoration: none; transition: background .12s;
  }
  .nav-item.active { color: #fff; background: rgba(255,255,255,.07); border-left-color: #2563eb; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; background: #fff; display: flex; flex-direction: column; }
  .main-header { padding: 30px 40px 0; font-size: 20px; font-weight: 700; letter-spacing: -.4px; color: var(--t1); }
  .main-body { flex: 1; padding: 60px 40px 40px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .circle-outer {
    width: 180px; height: 180px; border-radius: 50%;
    border: 3px solid var(--border); background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    position: relative; transition: all .3s;
  }
  .circle-outer::after {
    content: ''; position: absolute; inset: -12px;
    border-radius: 50%; border: 2px solid var(--border);
    opacity: .5; transition: border-color .3s;
  }
  .circle-outer.connected { background: var(--green-bg); border-color: var(--green-br); }
  .circle-outer.connected::after { border-color: var(--green-br); opacity: .4; }
  .circle-icon { width: 56px; height: 56px; }
  .circle-label { font-size: 13px; font-weight: 600; color: var(--t3); }
  .circle-outer.connected .circle-label { color: var(--green-d); }
  .stats-wrap { width: 100%; max-width: 680px; }
  .stats-title { font-size: 14px; font-weight: 600; color: var(--t2); margin-bottom: 14px; }
  .stats-row { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .stat-cell { flex: 1; padding: 22px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .stat-cell:last-child { border-right: none; }
  .stat-icon-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .stat-icon-row svg { width: 15px; height: 15px; color: var(--t3); }
  .stat-val { font-size: 22px; font-weight: 700; letter-spacing: -.6px; color: var(--t1); }
  .stat-lbl { font-size: 11px; color: var(--t3); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .stat-delta { font-size: 11px; color: var(--t3); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .badge-delta { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 4px; }
  .neg { background: #fee2e2; color: var(--red); }
  .pos { background: var(--green-bg); color: var(--green-d); }

  /* CTA Button */
  .cta-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 680px; }
  .btn-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--blue-med); color: #fff;
    font-family: var(--font); font-size: 15px; font-weight: 700;
    padding: 16px 32px; border-radius: 12px;
    text-decoration: none; width: 100%;
    transition: opacity .15s, transform .15s;
  }
  .btn-cta:hover { opacity: .9; transform: translateY(-1px); }
  .btn-cta svg { width: 18px; height: 18px; }
  .cta-sub { font-size: 12px; color: var(--t3); }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="18" fill="#2563EB"/>
        <path d="M28 24 L28 76 L52 76 C68 76 78 65 78 50 C78 35 68 24 52 24 Z" fill="white"/>
        <rect x="20" y="41" width="28" height="6" rx="3" fill="#2563EB"/>
        <rect x="20" y="53" width="22" height="6" rx="3" fill="#2563EB"/>
        <rect x="20" y="29" width="14" height="5" rx="2.5" fill="#2563EB"/>
        <rect x="20" y="66" width="10" height="5" rx="2.5" fill="#2563EB"/>
      </svg>
      <span class="logo-text">DataDash</span>
    </div>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="3" width="9" height="9" rx="1"/>
        <rect x="13" y="3" width="9" height="9" rx="1"/>
        <rect x="2" y="14" width="9" height="9" rx="1"/>
        <rect x="13" y="14" width="9" height="9" rx="1"/>
      </svg>
      Overview
    </a>
  </aside>

  <main class="main">
    <div class="main-header">Overview</div>
    <div class="main-body">

      <div class="circle-outer" id="ring">
        <svg class="circle-icon" viewBox="0 0 24 24" fill="none" id="ringIcon">
          <circle cx="12" cy="12" r="9" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1" fill="#94a3b8"/>
        </svg>
        <span class="circle-label" id="circleLabel">Not connected</span>
      </div>

      <div class="stats-wrap" id="statsWrap" style="display:none">
        <div class="stats-title">Tracked today</div>
        <div class="stats-row">
          <div class="stat-cell">
            <div class="stat-icon-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
              </svg>
            </div>
            <div class="stat-val" id="sRevenue">€ —</div>
            <div class="stat-lbl">Total Revenue</div>
            <div class="stat-delta"><span class="badge-delta neg" id="dRevenue">—</span> Since yesterday</div>
          </div>
          <div class="stat-cell">
            <div class="stat-icon-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
            </div>
            <div class="stat-val" id="sAov">€ —</div>
            <div class="stat-lbl">Average Order Value</div>
            <div class="stat-delta"><span class="badge-delta neg" id="dAov">—</span> Since yesterday</div>
          </div>
          <div class="stat-cell">
            <div class="stat-icon-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
            </div>
            <div class="stat-val" id="sOrders">—</div>
            <div class="stat-lbl">Total Orders</div>
            <div class="stat-delta"><span class="badge-delta neg" id="dOrders">—</span> Since yesterday</div>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-wrap" id="ctaWrap">
        <a href="https://mydatadash.lemonsqueezy.com/checkout/buy/61443440-69bf-4484-8716-250063423f14" target="_blank" class="btn-cta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
          Get Access — €8.99/month
        </a>
        <span class="cta-sub">14-day free trial · No credit card required · Cancel anytime</span>
      </div>

    </div>
  </main>
</div>

<script>
  const p     = new URLSearchParams(window.location.search);
  const shop  = p.get('shop') || p.get('shopify_shop') || '';
  const token = p.get('token') || p.get('shopify_token') || '';

  if (shop && token) {
    // Redirect to main dashboard with shop+token
    const dashUrl = 'https://datadash-backend-dhbe.onrender.com/datadash-dashboard.html?shop=' + encodeURIComponent(shop) + '&token=' + encodeURIComponent(token);
    setTimeout(() => { window.location.href = dashUrl; }, 1500);

    const ring = document.getElementById('ring');
    ring.classList.add('connected');
    document.getElementById('ringIcon').innerHTML =
      '<path d="M20 6 9 17l-5-5" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    document.getElementById('circleLabel').textContent = 'Connected';
    document.getElementById('statsWrap').style.display = 'block';

    (async () => {
      try {
        const base = 'https://datadash-backend-dhbe.onrender.com/api/shopify/proxy';
        const now  = new Date();
        const tod  = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
        const yes  = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).toISOString();

        const [todayRes, yestRes, countRes] = await Promise.all([
          fetch(`${base}?domain=${shop}&token=${token}&endpoint=orders.json?status=any&financial_status=paid&created_at_min=${tod}&limit=250`),
          fetch(`${base}?domain=${shop}&token=${token}&endpoint=orders.json?status=any&financial_status=paid&created_at_min=${yes}&created_at_max=${tod}&limit=250`),
          fetch(`${base}?domain=${shop}&token=${token}&endpoint=orders/count.json`)
        ]);

        const todayData = await todayRes.json();
        const yestData  = await yestRes.json();
        const countData = await countRes.json();

        const tOrders = todayData.orders || [];
        const yOrders = yestData.orders  || [];

        const tRev = tOrders.reduce((s, o) => s + parseFloat(o.total_price || 0), 0);
        const yRev = yOrders.reduce((s, o) => s + parseFloat(o.total_price || 0), 0);
        const tAov = tOrders.length ? tRev / tOrders.length : 0;
        const yAov = yOrders.length ? yRev / yOrders.length : 0;

        const pct = (a, b) => b === 0 ? null : Math.round(((a - b) / b) * 100);
        const badge = (id, val) => {
          const el = document.getElementById(id);
          if (val === null) { el.textContent = '—'; return; }
          el.textContent = (val >= 0 ? '+' : '') + val + '%';
          el.className = 'badge-delta ' + (val >= 0 ? 'pos' : 'neg');
        };

        document.getElementById('sRevenue').textContent = '€ ' + tRev.toFixed(2);
        document.getElementById('sAov').textContent     = '€ ' + tAov.toFixed(2);
        document.getElementById('sOrders').textContent  = countData.count !== undefined ? tOrders.length + ' / ' + countData.count + ' total' : tOrders.length.toLocaleString();

        badge('dRevenue', pct(tRev, yRev));
        badge('dAov',     pct(tAov, yAov));
        badge('dOrders',  pct(tOrders.length, yOrders.length));

      } catch(e) { console.error(e); }
    })();
  }
</script>
</body>
</html>
